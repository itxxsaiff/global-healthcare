<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline</title>
<meta name="theme-color" content="#0E8474">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F5F9F8; color: #0F2A2A; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; }
  main { max-width: 26rem; text-align: center; }
  h1 { font-family: Georgia, serif; font-weight: 600; font-size: 2rem; margin: 1rem 0 .5rem; letter-spacing: -.01em; }
  p { color: #4D5A53; }
  button { margin-top: 1rem; background: #0E8474; color: #fff; border: 0; border-radius: 10px; padding: .75rem 1.4rem; font-weight: 600; font-size: 1rem; cursor: pointer; }
  .note { margin-top: 2rem; font-size: .85rem; color: #7A857E; }
</style>
</head>
<body>
<main>
  <img src="/icons/favicon.svg" width="56" height="56" alt="">
  <h1>You're offline</h1>
  <p>We can't reach the internet right now. Check your connection and try again. Your bookings and messages are safe.</p>
  <button onclick="location.reload()">Try again</button>
  <p class="note">In an emergency, call your local emergency number.</p>
</main>
</body>
</html>
